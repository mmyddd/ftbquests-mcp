# Gradle itself must run on JDK 21 (Loom/MC 1.21.1 reject 17): set JAVA_HOME to a JDK 21, or pass
# -Dorg.gradle.java.home=<path> on the command line. Not pinned here because the path is machine-specific.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

minecraft_version=1.21.1
enabled_platforms=fabric,neoforge

archives_base_name=ftbquests-bridge
mod_version=1.1.0
maven_group=com.ftbqbridge

architectury_api_version=13.0.8
fabric_loader_version=0.15.11
fabric_api_version=0.102.1+1.21.1
neoforge_version=21.1.213

# FTB mods (1.21.1 / 2101.x line). Common artifact is dev.ftb.mods:ftb-quests
# (not -common); it transitively pulls ftb-library + ftb-teams + architectury.
ftb_quests_version=2101.1.36
ftb_library_version=2101.1.36
# Oldest FTB Quests whose API the bridge links against (declared as a required dependency in
# neoforge.mods.toml / fabric.mod.json). 2101.1.31 is where ServerQuestFile.deleteObjects(List)
# and Chapter.getPath(): Optional<Path> landed; 2101.1.28-30 are an incompatible in-between API.
ftb_quests_min_version=2101.1.31
