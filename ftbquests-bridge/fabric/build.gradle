plugins {
    id "com.gradleup.shadow" version "9.5.0"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowBundle
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    modApi "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionFabric")

    // Loader-specific FTB Quests at dev runtime so ServerQuestFile actually loads in runServer.
    modImplementation "dev.ftb.mods:ftb-quests-fabric:${rootProject.ftb_quests_version}"
    modImplementation("dev.ftb.mods:ftb-library-fabric:${rootProject.ftb_library_version}") {
        // Optional client keybind integration, published on a maven we don't otherwise need.
        exclude group: "de.siphalor.amecs.amecs-key-modifiers"
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "ftbQuestsMinVersion", rootProject.ftb_quests_min_version
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "ftbQuestsMinVersion": rootProject.ftb_quests_min_version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    archiveClassifier = null
    dependsOn shadowJar
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
