name: Build (1.21.1)

on:
  push:
    branches: [main, "1.21.1"]
  pull_request:
    branches: [main, "1.21.1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    name: ftbquests-bridge (NeoForge + Fabric, JDK 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ftbquests-bridge
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Also validates every gradle-wrapper.jar in the repo against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v6

      # gradlew is not committed with the executable bit, so invoke it through bash.
      - name: Build and test
        run: bash ./gradlew build --no-daemon --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: ftbquests-bridge-1.21.1
          path: |
            ftbquests-bridge/fabric/build/libs/*.jar
            ftbquests-bridge/neoforge/build/libs/*.jar
          if-no-files-found: warn
