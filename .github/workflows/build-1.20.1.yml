name: Build (1.20.1)

# Path-filtered so this only runs once the 1.20.1 Forge tree exists on the branch (or in a PR to it).
on:
  push:
    branches: ["1.20.1"]
    paths: ["ftbquests-bridge-1.20.1/**"]
  pull_request:
    branches: ["1.20.1"]
    paths: ["ftbquests-bridge-1.20.1/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    name: ftbquests-bridge-1.20.1 (Forge, JDK 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ftbquests-bridge-1.20.1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Also validates every gradle-wrapper.jar in the repo against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v6

      # Invoked through bash in case gradlew is committed without the executable bit.
      - name: Build and test
        run: bash ./gradlew build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: ftbquests-bridge-1.20.1
          path: ftbquests-bridge-1.20.1/build/libs/*.jar
          if-no-files-found: warn
